name: Debug Builds

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: 'Publish as Release build (creates GitHub Release)'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    name: Build Android APK (${{ inputs.release_build && 'Release' || 'Debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android Workloads
        run: |
          dotnet workload install android maui-android

      - name: Build Android APK
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-android \
            -p:TargetFrameworks=net9.0-android \
            -c ${{ inputs.release_build && 'Release' || 'Debug' }} \
            -p:AndroidPackageFormat=apk \
            -o ./publish-android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-${{ inputs.release_build && 'Release' || 'Debug' }}
          path: ./publish-android/*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (${{ inputs.release_build && 'Release' || 'Debug' }})
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install iOS Workload
        run: |
          dotnet workload install ios maui

      - name: Build iOS IPA
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-ios \
            -p:TargetFrameworks=net9.0-ios \
            -c ${{ inputs.release_build && 'Release' || 'Debug' }} \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=true \
            -p:IpaPackageDir="./publish-ios"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-${{ inputs.release_build && 'Release' || 'Debug' }}
          path: ./publish-ios/*.ipa
          if-no-files-found: error

  # ============================================================
  # macOS (Mac Catalyst) — produces a .app bundle
  # ============================================================
  build-maccatalyst:
    name: Build macOS App (${{ inputs.release_build && 'Release' || 'Debug' }})
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        run: |
          echo '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' > global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install Mac Catalyst Workload
        run: |
          dotnet workload install maccatalyst maui

      - name: Build Mac Catalyst App
        run: |
          dotnet publish ./BookViewer.Maui.csproj \
            -f net9.0-maccatalyst \
            -p:TargetFrameworks=net9.0-maccatalyst \
            -c ${{ inputs.release_build && 'Release' || 'Debug' }} \
            -p:RuntimeIdentifier=maccatalyst-x64 \
            -p:EnableCodeSigning=false \
            -p:CreatePackage=false \
            -o ./publish-maccatalyst

      - name: Zip .app Bundle
        run: |
          APP_PATH=$(find ./bin/${{ inputs.release_build && 'Release' || 'Debug' }}/net9.0-maccatalyst/maccatalyst-x64 -maxdepth 1 -name "*.app" -type d | head -n 1)
      
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found. Contents of publish dir:"
            ls -la ./publish-maccatalyst/
            echo "Contents of bin dir:"
            find ./bin -name "*.app" -type d
            exit 1
          fi
      
          echo "Found app at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")
      
          mkdir -p ./publish-maccatalyst
          cp -R "$APP_PATH" ./publish-maccatalyst/
      
          cd ./publish-maccatalyst
          zip -r -y "BookViewer-macOS-${{ inputs.release_build && 'Release' || 'Debug' }}.zip" "$APP_NAME"
          ls -la

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-${{ inputs.release_build && 'Release' || 'Debug' }}
          path: ./publish-maccatalyst/BookViewer-macOS-${{ inputs.release_build && 'Release' || 'Debug' }}.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows App (${{ inputs.release_build && 'Release' || 'Debug' }})
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create global.json
        shell: pwsh
        run: |
          '{ "sdk": { "version": "9.0.100", "rollForward": "latestFeature" } }' | Out-File -Encoding utf8 global.json

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Windows Workload
        run: |
          dotnet workload install maui-windows

      - name: Build Windows App
        run: |
          dotnet publish ./BookViewer.Maui.csproj `
            -f net9.0-windows10.0.19041.0 `
            -p:TargetFrameworks=net9.0-windows10.0.19041.0 `
            -c ${{ inputs.release_build && 'Release' || 'Debug' }} `
            -p:RuntimeIdentifierOverride=win10-x64 `
            -p:WindowsPackageType=None `
            -p:GenerateAppInstallerFile=false `
            -o ./publish-windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App-${{ inputs.release_build && 'Release' || 'Debug' }}
          path: ./publish-windows/**
          if-no-files-found: error

  # ============================================================
  # NEW: Publish to GitHub Releases (only when release_build = true)
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-maccatalyst, build-windows]
    if: ${{ inputs.release_build }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Android-APK-Release
          path: ./artifacts/android

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: iOS-IPA-Release
          path: ./artifacts/ios

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macOS-App-Release
          path: ./artifacts/macos

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-App-Release
          path: ./artifacts/windows

      - name: Prepare Release Assets
        run: |
          set -e
          mkdir -p ./release-assets

          # Android APK
          cp ./artifacts/android/*.apk ./release-assets/ || true

          # iOS IPA
          cp ./artifacts/ios/*.ipa ./release-assets/ || true

          # macOS .app zip
          cp ./artifacts/macos/*.zip ./release-assets/ || true

          # Windows — zip the publish folder
          if [ -d ./artifacts/windows ] && [ "$(ls -A ./artifacts/windows)" ]; then
            cd ./artifacts/windows
            zip -r -y "$GITHUB_WORKSPACE/release-assets/BookViewer-Windows-Release.zip" .
          fi

          echo "Release assets:"
          ls -la ./release-assets

      - name: Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-build.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated release build for BookViewer.

            **Commit:** ${{ github.sha }}
            **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: false
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
